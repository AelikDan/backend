<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<title>Categorias | Sistema de Estoque e Patrimônio</title>
		<link rel="stylesheet" th:href="@{/css/style.css}"/>
	</head>
	<body>
		<div th:include="~{fragments/header :: header}"></div>

		<main class="senai-main">
			<section class="senai-hero">
				<div class="senai-shell" style="flex-direction: column; align-items: flex-start; gap: 20px;">

					<div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
						<div>
							<h1 class="senai-title">Categorias</h1>
							<p class="senai-subtitle">Gerencie as categorias de materiais.</p>
						</div>
						<a class="senai-button" th:href="@{/categorias/novo}">+ Nova Categoria</a>
					</div>

					<div th:if="${sucesso}" class="senai-alert senai-alert-success" style="width:100%">
						<p th:text="${sucesso}"></p>
					</div>

					<table style="width:100%; border-collapse:collapse;">
						<thead>
							<tr style="border-bottom: 2px solid var(--senai-gray-200);">
								<th style="text-align:left; padding:10px;">Nome</th>
								<th style="text-align:left; padding:10px;">Descrição</th>
								<th style="text-align:left; padding:10px;">Ações</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="categoria : ${categorias}" style="border-bottom: 1px solid var(--senai-gray-200);">
								<td style="padding:10px;" th:text="${categoria.nome}"></td>
								<td style="padding:10px;" th:text="${categoria.descricao}"></td>
								<td style="padding:10px;">
									<a class="senai-link" th:href="@{/categorias/editar/{id}(id=${categoria.id})}">Editar</a>
									&nbsp;|&nbsp;
									<a class="senai-link" th:href="@{/categorias/excluir/{id}(id=${categoria.id})}" onclick="return confirm('Excluir?')">Excluir</a>
								</td>
							</tr>
						</tbody>
					</table>

				</div>
			</section>
		</main>

		<div th:include="~{fragments/footer :: footer}"></div>
	</body>
</html>
